# Системный nginx на Beget (не docker) для https://mailer.websitesharing.ru
#
# ВАЖНО: не копируйте этот файл поверх рабочего vhost вслепую.
# Сначала найдите текущий конфиг:
#   sudo nginx -T 2>/dev/null | grep -nE 'mailer|ssl_certificate'
#   ls /etc/letsencrypt/live/
#
# Если сертификат уже есть (типичный путь ниже) — можно обновить
# существующий server {} таймаутами, не удаляя ssl_certificate.
#
# Выпуск/обновление cert (если нужно):
#   sudo certbot --nginx -d mailer.websitesharing.ru
#
# Применить:
#   sudo nginx -t && sudo nginx -s reload

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name mailer.websitesharing.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mailer.websitesharing.ru;

    # Поправьте путь, если certbot положил сертификат иначе:
    #   ls /etc/letsencrypt/live/
    ssl_certificate     /etc/letsencrypt/live/mailer.websitesharing.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailer.websitesharing.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
